[workspace]
members = [
    "protocol",
    "kv-client",
    "kv-server",
    "view-service",
]

resolver = "3"

[workspace.dependencies]
protocol = {path = "protocol"}
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1", features = ["full"]}
